name: convert-worlds

on:
  push:
    paths:
      - 'worlds/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    # don't react to the bot's own commit
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert worlds and validate (fails on ERROR, warnings are only reported)
        run: python tools/convert.py
      - name: Write converted entries into the pack
        run: python tools/build_pack.py
      - name: Commit Structure/ and pack/scripts/custom.js
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Structure pack/scripts/custom.js
          git diff --cached --quiet || git commit -m "convert: update Structure and pack data [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: VillageLibrary_BP
          path: dist/*.mcpack
